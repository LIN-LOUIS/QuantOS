name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check Python dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run offline test suite
        env:
          DEEPSEEK_API_KEY: ""
          TUSHARE_TOKEN: ""
          TAVILY_API_KEY: ""
          EXA_API_KEY: ""
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend tests
        working-directory: web
        run: npm test -- --reporter=dot
      - name: Typecheck frontend
        working-directory: web
        run: npm run typecheck
      - name: Build production Workspace
        working-directory: web
        run: npm run build
      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit

  public-preview:
    needs: [pytest, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install clean-room operator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run no-cache Public Preview release gate
        env:
          DEEPSEEK_API_KEY: ""
          TUSHARE_TOKEN: ""
          TAVILY_API_KEY: ""
          EXA_API_KEY: ""
        run: >-
          python scripts/accept_release_candidate.py
          --repository .
          --output /tmp/quantos-public-preview-acceptance
          --no-cache
          --python "$(command -v python)"
      - name: Preserve acceptance manifest
        uses: actions/upload-artifact@v4
        with:
          name: public-preview-acceptance
          path: /tmp/quantos-public-preview-acceptance/acceptance-result.json
          if-no-files-found: error
